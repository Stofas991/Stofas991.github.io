name: Aktualizace cen (Wavy Boats)

on:
  schedule:
    - cron: '0 3 * * *'   # kazdy den ve 3:00 UTC (5:00 letniho casu CZ)
  workflow_dispatch:        # tlacitko "Run workflow" v GitHub UI

# Job potrebuje pravo zapisu, aby mohl commitnout vysledky zpatky.
permissions:
  contents: write

jobs:
  generuj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalace zavislosti
        run: pip install requests

      - name: Stahni a zpracuj export
        env:
          FEED_HASH: ${{ secrets.WAVY_FEED_HASH }}
        run: python3 scripts/generuj-ceny.py

      - name: Commitni vysledek (jen pokud se zmenil)
        run: |
          git config user.name "ceny-bot"
          git config user.email "actions@users.noreply.github.com"
          # POZOR: generuj-ceny.py pise DVA soubory - ceny.json i kody.json
          # (puvodni kody, oddelene 24.8.2026). Kdyz se tady prida jen
          # ceny.json, kody.json zustane navzdy na verzi, ktera se do repa
          # dostala naposledy rucne - nove vyplnene puvodni kody by se ve
          # vypisu katalogu nikdy neobjevily. Pri pridani dalsiho vystupu
          # do generatoru ho pridej i sem.
          git add scripts/ceny.json scripts/kody.json
          git diff --staged --quiet || git commit -m "Aktualizace dat $(date -u +%Y-%m-%d)"
          git push